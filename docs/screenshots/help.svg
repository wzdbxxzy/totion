<rect x="1" y="1" width="1278" height="40" rx="0" fill="#161b22"/>
</g>
<rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#30363d"/>
<circle cx="26" cy="21" r="6" fill="#ff5f56"/>
<circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
<circle cx="66" cy="21" r="6" fill="#27c93f"/>
<text x="640.0" y="26" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="middle">totion — 帮助</text>
<rect x="180" y="70" width="920" height="580" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="210" y="114" font-weight="600" fill="#39d0d8" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" text-anchor="start">帮助 · v0.10.0</text>
<text x="210" y="160" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">视图</text>
<text x="330" y="160" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">1 今日   2 工作区   3 日历   4 习惯   5 统计   6 留言</text>
<text x="210" y="212" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">今日</text>
<text x="330" y="212" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">Tab 待办/习惯/总结；h/l 或 [ ] 切日期；w 近一周；a 写总结</text>
<text x="210" y="264" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">工作区</text>
<text x="330" y="264" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">Tab 页面/内容；右下常驻全部总结；J 全屏；n 文本；t 待办</text>
<text x="210" y="316" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">日历</text>
<text x="330" y="316" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">h/l 选日；j/k 前后一周；[ ] 换月；Enter 议程；v 框选</text>
<text x="210" y="368" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">批量</text>
<text x="330" y="368" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">选中日期范围后按 t 批量新建待办（最多 62 天）</text>
<text x="210" y="420" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">习惯</text>
<text x="330" y="420" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">n 新建；d 归档；Space 打卡；u 撤销；Ctrl+F 切换频率</text>
<text x="210" y="472" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">删除</text>
<text x="330" y="472" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">按 d 后输入 delete 并回车确认；Esc 取消</text>
<text x="210" y="524" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">协作</text>
<text x="330" y="524" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">C 评论；6 留言；m 成员视角；i 邀请码；/ 搜索；r 同步</text>
<text x="210" y="576" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">其他</text>
<text x="330" y="576" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">? 帮助；q 或 Ctrl+C 退出</text>
<text x="210" y="622" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="start">按 Esc 关闭</text>
</svg>
