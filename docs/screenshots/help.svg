<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><clipPath id="win-clip"><rect x="1" y="1" width="1278" height="718" rx="14"/></clipPath></defs>
<g clip-path="url(#win-clip)">
<rect x="1" y="1" width="1278" height="718" rx="0" fill="#0d1117"/>
<rect x="1" y="1" width="1278" height="40" rx="0" fill="#161b22"/>
</g>
<rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#30363d"/>
<circle cx="26" cy="21" r="6" fill="#ff5f56"/>
<circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
<circle cx="66" cy="21" r="6" fill="#27c93f"/>
<text x="640.0" y="26" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="middle">totion — 帮助</text>
<rect x="180" y="70" width="920" height="580" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="210" y="114" font-weight="600" fill="#39d0d8" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" text-anchor="start">帮助</text>
<text x="210" y="160" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">视图</text>
<text x="330" y="160" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">1 今日   2 工作区   3 日历   4 习惯   5 统计</text>
<text x="210" y="212" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">移动</text>
<text x="330" y="212" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">j/k 或 ↑/↓ 上下移动；Tab 切换页面/内容面板</text>
<text x="210" y="264" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">日历</text>
<text x="330" y="264" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">h/l 前后一天；j/k 前后一周；[ ] 换月</text>
<text x="210" y="316" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">编辑</text>
<text x="330" y="316" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">Enter/e 编辑；Enter 保存；Esc 取消</text>
<text x="210" y="368" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">待办/习惯</text>
<text x="330" y="368" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">Space 勾选或打卡；u 撤销今天的打卡</text>
<text x="210" y="420" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">新建</text>
<text x="330" y="420" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">t 待办；c 日程；n 习惯；N 页面</text>
<text x="210" y="472" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">协作</text>
<text x="330" y="472" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">C 打开评论；/ 搜索；r 手动同步</text>
<text x="210" y="524" font-weight="600" fill="#c9d1d9" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" text-anchor="start">其他</text>
<text x="330" y="524" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" text-anchor="start">? 帮助；q 或 Ctrl+C 退出</text>
<text x="210" y="622" fill="#8b949e" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="start">按 Esc 关闭</text>
</svg>
